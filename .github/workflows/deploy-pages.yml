# نشر النسخة الثابتة من CryptoScope AI على GitHub Pages
# المتطلب لمرة واحدة: Settings → Pages → Build and deployment → Source = "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, ccr-3a885637-eow3xk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # مطلوب فقط لتوليد عميل Prisma — النسخة الثابتة لا تتصل بأي قاعدة بيانات
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
